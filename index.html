<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vila Fisio - Clínica de Pilates</title>
    <style>
        :root {
            --primary-color: #005954;
            --primary-dark: #00433f;
            --primary-light: #e0f2f1;
            --bg-color: #f7f9fa;
            --card-bg: #e9ecef;
            --white: #ffffff;
            --text-dark: #1e293b;
            --text-medium: #475569;
            --text-light: #94a3b8;
            --border-color: #cbd5e1;
            --border-focus: #005954;
            --error-color: #ef4444;
            --success-color: #10b981;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            line-height: 1.6;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: var(--white);
            padding: 1rem 5%;
            box-shadow: var(--shadow-sm);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        .logo-container img {
            height: 80px;
            max-width: 100%;
            object-fit: contain;
        }

        nav a {
            color: var(--text-medium);
            text-decoration: none;
            font-weight: 600;
            margin-left: 2rem;
            transition: var(--transition);
        }

        nav a:hover {
            color: var(--primary-color);
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 3rem 5%;
        }

        .hero {
            background-color: var(--white);
            padding: 3rem;
            border-radius: 12px;
            box-shadow: var(--shadow-md);
            text-align: center;
            max-width: 800px;
            width: 100%;
            border-top: 5px solid var(--primary-color);
        }

        h1 {
            color: var(--primary-dark);
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: var(--text-medium);
            font-size: 1.1rem;
            margin-bottom: 2rem;
        }

        .btn {
            display: inline-block;
            background-color: var(--primary-color);
            color: var(--white);
            padding: 0.8rem 2rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            transition: var(--transition);
            box-shadow: var(--shadow-sm);
        }

        .btn:hover {
            background-color: var(--primary-dark);
            box-shadow: var(--shadow-md);
            transform: translateY(-2px);
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            background-color: var(--white);
            color: var(--text-light);
            border-top: 1px solid var(--border-color);
        }

        @media (max-width: 768px) {
            header {
                flex-direction: column;
                gap: 1rem;
            }

            nav a {
                margin: 0 1rem;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="logo-container">
            <!-- A imagem é carregada com o nome exato solicitado -->
            <img src="logo.png" alt="Logo Vila Fisio">
        </div>
        <nav>
            <a href="index.html">Home</a>
            <a href="privacidade.html">Política de Privacidade</a>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Vila Fisio</h1>
            <p>Sua clínica especializada em aulas de Pilates, Fisioterapia e Dermatofuncional. Transforme seu corpo e
                mente com nossos profissionais dedicados.</p>
            <a href="privacidade.html" class="btn">Ler Política de Privacidade do App</a>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Vila Fisio. Todos os direitos reservados.</p>
    </footer>

</body>

</html>
